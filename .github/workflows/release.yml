# Builds Owlcart for Windows and Linux and publishes a GitHub release
# whenever the version in src-tauri/tauri.conf.json is one that hasn't been
# released yet. Bump it with: npm run bump -- 0.2.0 (or patch / minor / major)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Is it already released?
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already released; nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$VERSION; building."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Builds upload into a draft; it's only published if every build works.
      - name: Create draft release
        id: draft
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Clear out a draft left by an earlier failed run of the same version.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id")
          for id in $old; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Owlcart v$VERSION" -F draft=true \
            -f body="**Windows:** download the \`-setup.exe\` installer.
          **Linux:** the \`.AppImage\` runs anywhere (install the \`aria2\` package first); the \`.deb\` / \`.rpm\` install aria2 for you." \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            # Older Ubuntu keeps the AppImage compatible with more distros.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm packages
        run: npm ci

      # On Windows, tauri.windows.conf.json's beforeBuildCommand downloads the
      # official aria2c.exe and bundles it with the app automatically.
      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.check.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.check.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false --jq '"Published \(.html_url)"'

