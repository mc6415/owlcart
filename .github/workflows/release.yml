# Builds Owlcart for Windows, Linux and Android and publishes a GitHub release when the
# version in src-tauri/tauri.conf.json goes up. Bump it with:
#   npm run bump -- patch   (or minor / major / 1.2.3)

name: Release

on:
  push:
    branches: [main]
    # Only pushes that touch the version file start this workflow at all.
    paths: [src-tauri/tauri.conf.json]
  workflow_dispatch: # run by hand from the Actions tab

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to compare with earlier releases

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      # Build only when the version is higher than every released version, so
      # other edits to tauri.conf.json (or an accidental downgrade) don't release.
      - name: Is it a new, higher version?
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          latest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "No releases yet; building v$VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$VERSION" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ]; then
            echo "v$VERSION is newer than v$latest; building."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION isn't newer than the latest release (v$latest); nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Builds upload into a draft; it's only published if every build works.
      - name: Create draft release
        id: draft
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Clear out a draft left by an earlier failed run of the same version.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id")
          for id in $old; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done

          # Changelog: every commit since the previous release, minus version bumps.
          prev=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$prev" ] && git merge-base --is-ancestor "v$prev" HEAD; then
            range="v$prev..HEAD"
          else
            range="HEAD"
          fi
          changes=$(git log --no-merges --reverse --format="- %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%H))" $range \
            | grep -vE '^- (Bump version|Release v)' || true)
          {
            echo "**Windows:** download the \`-setup.exe\` installer."
            echo "**Linux:** the \`.AppImage\` runs anywhere; or install the \`.deb\` / \`.rpm\`."
            echo
            echo "## What's changed"
            echo
            echo "${changes:-- Maintenance release.}"
            if [ "$range" != "HEAD" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/v$prev...v$VERSION"
            fi
          } > notes.md
          cat notes.md

          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Owlcart v$VERSION" -F draft=true \
            -F body=@notes.md \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            # Older Ubuntu keeps the AppImage compatible with more distros.
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm packages
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.check.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}

  android:
    name: Build (Android)
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android

      - name: Install npm packages
        run: npm ci

      # The release signing key, from the repo's secrets. Every APK must be
      # signed with the same key, or Android won't install it as an update.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/owlcart-release.jks"
          printf 'storeFile=%s\nkeyAlias=owlcart\npassword=%s\n' "$RUNNER_TEMP/owlcart-release.jks" "$PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        run: npm run tauri android build -- --apk --target aarch64

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.check.outputs.release_id }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=Owlcart_${VERSION}_android_arm64.apk" \
            --output /dev/null
          # Mention the APK in the release notes.
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .body)
          printf '%s\n**Android:** install the `.apk` (64-bit ARM; allow installs from unknown sources).\n' "$body" > notes.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F body=@notes.md --jq .html_url

  publish:
    name: Publish release
    needs: [check, build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.check.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false --jq '"Published \(.html_url)"'

