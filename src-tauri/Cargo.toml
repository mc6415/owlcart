[package]
name = "owlcart"
version = "0.7.5"
description = "Browse minerva-archive.org listings and download single files from their torrents"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "owlcart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = "0.14.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
scraper = "0.29.0"
base64 = "0.23.1"
dirs = "7.0.0"
walkdir = "2.5.0"
url = "2.5.8"
anyhow = "1.0.104"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "time", "sync", "fs", "macros", "rt-multi-thread"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate", "deflate64"] }
percent-encoding = "2"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
ruzstd = "0.9.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Local copy of librqbit with a larger per-peer read buffer (see
# vendor/librqbit/src/read_buf.rs). Drop this once upstream raises the limit.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
